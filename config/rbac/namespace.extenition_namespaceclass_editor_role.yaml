# This rule is not used by the project akuity itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the namespace.extension.test.akuity.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: akuity
    app.kubernetes.io/managed-by: kustomize
  name: namespace.extension-namespaceclass-editor-role
rules:
- apiGroups:
  - namespace.extension.test.akuity
  resources:
  - namespaceclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - namespace.extension.test.akuity
  resources:
  - namespaceclasses/status
  verbs:
  - get

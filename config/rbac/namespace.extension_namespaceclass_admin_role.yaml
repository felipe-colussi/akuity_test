# This rule is not used by the project akuity itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over namespace.extension.test.akuity.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permisfsions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: akuity
    app.kubernetes.io/managed-by: kustomize
  name: namespace.extension-namespaceclass-admin-role
rules:
- apiGroups:
  - namespace.extension.test.akuity
  resources:
  - namespaceclasses
  verbs:
  - '*'
- apiGroups:
  - namespace.extension.test.akuity
  resources:
  - namespaceclasses/status
  verbs:
  - get


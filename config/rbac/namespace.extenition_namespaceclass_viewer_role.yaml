# This rule is not used by the project akuity itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to namespace.extenition.test.akuity resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: akuity
    app.kubernetes.io/managed-by: kustomize
  name: namespace.extenition-namespaceclass-viewer-role
rules:
- apiGroups:
  - namespace.extenition.test.akuity
  resources:
  - namespaceclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - namespace.extenition.test.akuity
  resources:
  - namespaceclasses/status
  verbs:
  - get
